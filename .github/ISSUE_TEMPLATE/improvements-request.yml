name: 🚀 Improvement Request
description: Suggest an improvement for this project
title: "[Improvement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement!

  - type: textarea
    id: what-improvement
    attributes:
      label: What improvement would you like to suggest?
      description: A clear and concise description of what you want to improve
      placeholder: Describe your improvement...
    validations:
      required: true

  - type: textarea
    id: why-improvement
    attributes:
      label: Why is this improvement needed?
      description: Explain what problem this improvement will solve
      placeholder: This improvement will help...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the improvement request here
      placeholder: Any additional information...