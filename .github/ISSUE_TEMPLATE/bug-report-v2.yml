name: Bug Report 🪲
description: Create a bug report to help us improve
title: '[Bug]: '
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # Please follow these steps first:
  - type: markdown
    attributes:
      value: |
        ## Make a minimal reproduction
        The simpler you can make it, the more likely we are to successfully verify and fix the bug. 
        
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Please provide detailed steps to reproduce the bug.
      placeholder: |
        Example steps (replace with your own):
        1. Login with valid credentials as a ...
        2. Navigate to ...
        3. Click on ...
        4. ...
        5. ...
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Actual behavior
      description: 
        A clear and concise description of the unexpected behavior.
        Please include any relevant output here, especially any error messages.
      placeholder: I expect to see X or Y
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant
    validations:
      required: false