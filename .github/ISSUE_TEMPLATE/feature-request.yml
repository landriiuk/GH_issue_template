name: Feature Request 💡
description: Propose a new feature or enhancement
title: '[Feature Request]: '
labels: ["feature_request"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for helping improve this project!
        Please provide as much detail as possible about your feature request.
  - type: textarea
    id: problem
    attributes:
      label: '🎯 Problem Statement'
      description: What problem does this feature solve? What need does it address?
      placeholder: |
        Example: "It's difficult to..."
        Example: "Users need a way to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: '💡 Proposed Solution'
      description: Describe your suggested solution and its benefits.
      placeholder: |
        - What should the feature do?
        - How should it work?
        - What are the expected outcomes?
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: '📝 Additional Context'
      description: Add any other context, screenshots, or examples about the feature request here.
    validations:
      required: false
